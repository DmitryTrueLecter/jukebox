# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by deploy/remote.sh.
# Keep the desktop's PipeWire away from the amp: the jukebox talks to ALSA directly.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "MAX98357A" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
