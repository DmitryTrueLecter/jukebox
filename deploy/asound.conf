# Installed to /etc/asound.conf by deploy/remote.sh.
#
# "jukebox": any format/rate/channel count in, (L+R)/2 on BOTH output channels.
# The MAX98357A is a mono amp whose channel (left / right / (L+R)/2) depends on
# the SD_MODE pin voltage, so we mix in software and the mode no longer matters.

pcm.jukebox {
    type plug
    slave.pcm "jukebox_mono"
}

pcm.jukebox_mono {
    type route
    slave {
        pcm "jukebox_hw"
        channels 2
    }
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}

pcm.jukebox_hw {
    type plug
    slave.pcm "hw:CARD=MAX98357A,DEV=0"
}
